body {

.header {

  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  position: relative;
  z-index: 10;
}
.header-left h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
.header-left .meta { font-size: 12px; opacity: 0.7; margin-top: 2px; }
.header-right { display: flex; gap: 10px; align-items: center; }
.header-btn {
  padding: 7px 14px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  color: white;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  display: flex; align-items: center; gap: 6px;
  transition: background 0.15s;
}
.header-btn:hover { background: rgba(255,255,255,0.25); }
.controls {
  background: white;
  padding: 9px 20px;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  position: relative;
  z-index: 5;
}
.search-wrap { position: relative; }
.search-icon {
  position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%);
  pointer-events: none;
  color: #94a3b8;
  font-size: 14px;
}
#search {
  padding: 7px 12px 7px 32px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 13px;
  width: 240px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
#search:focus {
  border-color: #1d4ed8;
  box-shadow: 0 0 0 3px rgba(29,78,216,0.12);
}
.ctrl-btn {
  padding: 6px 12px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  background: white;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  color: #374151;
  transition: all 0.15s;
  white-space: nowrap;
}
.ctrl-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
.emp-count {
  margin-left: auto;
  background: #f1f5f9;
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 12px;
  color: #64748b;
  font-weight: 500;
}
.legend-bar {
  background: white;
  padding: 7px 20px;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  align-items: center;
  position: relative;
  z-index: 5;
}
.legend-label { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 4px; }
.legend-item {
  display: flex; align-items: center; gap: 4px;
  font-size: 11px; cursor: pointer;
  padding: 2px 8px; border-radius: 20px;
  border: 1.5px solid transparent;
  transition: all 0.15s;
  color: #374151;
  font-weight: 500;
}
.legend-item:hover { background: #f8fafc; }
.legend-item.active { color: white !important; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
#chart {
  width: 100%;
  height: calc(100vh - 155px);
  overflow: hidden;
  background: #f8fafc;
  background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
  background-size: 28px 28px;
  position: relative;
}
svg { display: block; }
.node { cursor: pointer; }
.node rect {
  transition: filter 0.2s;
}
.node:hover rect {
  filter: drop-shadow(0 6px 16px rgba(0,0,0,0.18)) !important;
}
.node.dimmed { opacity: 0.1; pointer-events: none; }
.node.search-match rect { stroke-width: 3 !important; }
.link {
  fill: none;
  stroke: #94a3b8;
  stroke-width: 1.5;
}
.link.dimmed { opacity: 0.05; }
#tooltip {
  position: fixed;
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 13px;
  pointer-events: none;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15);
  z-index: 9999;
  max-width: 250px;
  display: none;
}
.tt-name { font-weight: 700; font-size: 14px; color: #1e293b; margin-bottom: 3px; }
.tt-title { color: #64748b; font-size: 12px; margin-bottom: 8px; line-height: 1.4; }
.tt-dept { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; color: white; letter-spacing: 0.02em; }
.tt-detail { color: #94a3b8; font-size: 11px; margin-top: 6px; }
.tt-reports { color: #64748b; font-size: 12px; margin-top: 8px; padding-top: 8px; border-top: 1px solid #f1f5f9; }
.zoom-controls {
  position: absolute;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  z-index: 100;
}
.zoom-btn {
  width: 34px; height: 34px;
  background: white;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  color: #374151;
  transition: all 0.15s;
}
.zoom-btn:hover { background: #f1f5f9; box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
.note-banner {
  position: absolute;
  bottom: 20px;
  left: 20px;
  background: rgba(255,255,255,0.9);
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 11px;
  color: #64748b;
  z-index: 100;
  backdrop-filter: blur(4px);
}
@media print {
  .controls, .legend-bar, .zoom-controls, .note-banner { display: none !important; }
  .header { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  #chart { height: auto; overflow: visible; background: white !important; }
  svg { width: 100% !important; height: auto !important; }
}
</style>

// =============================================================
// BUILD HIERARCHY
// =============================================================
function buildTree(employees) {
  const byId = {};
  employees.forEach(e => {
    byId[e.id] = { ...e, children: [] };
  });

  const roots = [];
  employees.forEach(e => {
    const node = byId[e.id];
    if (e.mgr && byId[e.mgr]) {
      byId[e.mgr].children.push(node);
    } else {
      roots.push(node);
    }
  });

  function sortNode(n) {
    n.children.sort((a, b) => {
      // Sort managers with direct reports first, then alphabetically
      const aHas = a.children.length > 0 ? 0 : 1;
      const bHas = b.children.length > 0 ? 0 : 1;
      if (aHas !== bHas) return aHas - bHas;
      return a.name.localeCompare(b.name);
    });
    n.children.forEach(sortNode);
  }

  // Sort roots: known leadership first
  const leaderOrder = ['Brian Litvack', 'Jeremy Goldberg', 'Nick Naso', 'Daniel Eskenazi', 'Javie Rios'];
  roots.sort((a, b) => {
    const ai = leaderOrder.indexOf(a.name);
    const bi = leaderOrder.indexOf(b.name);
    if (ai >= 0 && bi >= 0) return ai - bi;
    if (ai >= 0) return -1;
    if (bi >= 0) return 1;
    const aHas = a.children.length > 0 ? 0 : 1;
    const bHas = b.children.length > 0 ? 0 : 1;
    if (aHas !== bHas) return aHas - bHas;
    return a.name.localeCompare(b.name);
  });

  roots.forEach(sortNode);

  return {
    id: '__root__',
    name: 'LeagueApps',
    title: '',
    dept: '',
    mgr: null,
    children: roots
  };
}

// =============================================================
// CHART INIT
// =============================================================
const NW = 192, NH = 66, PX = 28, PY = 14;
let svg, gMain, zoomBehavior, rootNode;

function initChart() {
  const container = document.getElementById('chart');
  const W = container.clientWidth;
  const H = container.clientHeight;

  svg = d3.select('#chart').append('svg')
    .attr('width', W).attr('height', H);

  zoomBehavior = d3.zoom()
    .scaleExtent([0.08, 2.5])
    .on('zoom', e => gMain.attr('transform', e.transform));

  svg.call(zoomBehavior);
  gMain = svg.append('g');

  const treeData = buildTree(EMPLOYEES);
  rootNode = d3.hierarchy(treeData);

  // Collapse all except top-level by default
  rootNode.descendants().forEach(d => {
    if (d.depth >= 2 && d.children) {
      d._children = d.children;
      d.children = null;
    }
  });

  update(rootNode);

  // Initial view: center on visible chart
  setTimeout(() => fitView(), 200);
}

function treeLayout(root) {
  d3.tree()
    .nodeSize([NW + PX, NH + PY])
    .separation((a, b) => a.parent === b.parent ? 1 : 1.1)
    (root);
}

function update(source) {
  treeLayout(rootNode);

  const nodes = rootNode.descendants().filter(d => d.data.id !== '__root__');
  const links = rootNode.links().filter(d => d.source.data.id !== '__root__');

  document.getElementById('emp-count').textContent = nodes.length + ' employees';

  // --- LINKS ---
  const link = gMain.selectAll('.link')
    .data(links, d => d.target.data.id);

  const linkEnter = link.enter().append('path').attr('class', 'link')
    .attr('d', () => {
      const s = source.y0 !== undefined ? source : source.parent || source;
      const ox = s.x0 || s.x || 0, oy = (s.y0 || s.y || 0) + NH/2;
      return `M${ox},${oy} C${ox},${oy} ${ox},${oy} ${ox},${oy}`;
    });

  linkEnter.merge(link).transition().duration(300)
    .attr('d', d => {
      const sx = d.source.x, sy = d.source.y + NH/2;
      const tx = d.target.x, ty = d.target.y - NH/2;
      const my = (sy + ty) / 2;
      return `M${sx},${sy} C${sx},${my} ${tx},${my} ${tx},${ty}`;
    });

  link.exit().transition().duration(300)
    .attr('d', () => {
      const ox = source.x, oy = source.y + NH/2;
      return `M${ox},${oy} C${ox},${oy} ${ox},${oy} ${ox},${oy}`;
    })
    .remove();

  // --- NODES ---
  const node = gMain.selectAll('.node')
    .data(nodes, d => d.data.id);

  const nodeEnter = node.enter().append('g').attr('class', 'node')
    .attr('transform', () => {
      const p = source.y0 !== undefined ? source : (source.parent || source);
      return `translate(${(p.x0 || p.x || 0) - NW/2},${p.y0 || p.y || 0})`;
    })
    .on('click', (e, d) => {
      if (d.children) { d._children = d.children; d.children = null; }
      else { d.children = d._children; d._children = null; }
      update(d);
    })
    .on('mouseover', showTip)
    .on('mousemove', moveTip)
    .on('mouseout', hideTip);

  // Shadow / background
  nodeEnter.append('rect')
    .attr('width', NW).attr('height', NH).attr('y', -NH/2)
    .attr('rx', 8).attr('ry', 8)
    .attr('fill', 'white')
    .attr('stroke', d => deptColor(d.data.dept))
    .attr('stroke-width', 1.5)
    .style('filter', 'drop-shadow(0 2px 6px rgba(0,0,0,0.09))');

  // Left color bar
  nodeEnter.append('rect')
    .attr('width', 5).attr('height', NH).attr('y', -NH/2)
    .attr('rx', 8).attr('ry', 8)
    .attr('fill', d => deptColor(d.data.dept));

  // Initials circle
  nodeEnter.append('circle')
    .attr('cx', 22).attr('cy', 0)
    .attr('r', 14)
    .attr('fill', d => deptColor(d.data.dept))
    .attr('opacity', 0.15);

  nodeEnter.append('text')
    .attr('class', 'initials')
    .attr('x', 22).attr('y', 4)
    .attr('text-anchor', 'middle')
    .attr('font-size', '10px')
    .attr('font-weight', '700')
    .attr('fill', d => deptColor(d.data.dept))
    .text(d => d.data.name.split(' ').map(p => p[0]).join('').substring(0, 2));

  // Name
  nodeEnter.append('text')
    .attr('class', 'emp-name')
    .attr('x', 42).attr('y', -6)
    .attr('font-size', '12px').attr('font-weight', '700').attr('fill', '#1e293b')
    .text(d => truncate(d.data.name, 18));

  // Title
  nodeEnter.append('text')
    .attr('class', 'emp-title')
    .attr('x', 42).attr('y', 9)
    .attr('font-size', '10px').attr('fill', '#64748b')
    .text(d => truncate(d.data.title || '', 24));

  // Dept
  nodeEnter.append('text')
    .attr('class', 'emp-dept')
    .attr('x', 42).attr('y', 23)
    .attr('font-size', '9px').attr('font-weight', '600')
    .attr('fill', d => deptColor(d.data.dept))
    .text(d => (d.data.dept || '').toUpperCase().substring(0, 22));

  // Expand/collapse badge
  nodeEnter.append('g').attr('class', 'badge')
    .attr('transform', `translate(${NW/2}, ${NH/2})`);

  // Merge + animate
  const nodeUpdate = nodeEnter.merge(node);
  nodeUpdate.transition().duration(300)
    .attr('transform', d => `translate(${d.x - NW/2},${d.y})`);

  // Update badge (child count indicator)
  nodeUpdate.select('.badge').selectAll('*').remove();
  nodeUpdate.each(function(d) {
    const cnt = (d.children || d._children || []).length;
    if (cnt === 0) return;
    const badge = d3.select(this).select('.badge');
    badge.append('circle')
      .attr('r', 9).attr('cy', 0)
      .attr('fill', d._children ? '#1d4ed8' : deptColor(d.data.dept))
      .attr('opacity', 0.9);
    badge.append('text')
      .attr('text-anchor', 'middle').attr('y', 4)
      .attr('font-size', '9px').attr('font-weight', '800')
      .attr('fill', 'white')
      .text(d._children ? `+${cnt}` : cnt);
  });

  node.exit().transition().duration(300)
    .attr('transform', `translate(${source.x - NW/2},${source.y})`)
    .remove();

  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
}

function truncate(s, max) {
  return s.length > max ? s.substring(0, max - 1) + '…' : s;
}

// =============================================================
// CONTROLS
// =============================================================
function expandAll() {
  rootNode.descendants().forEach(d => {
    if (d._children) { d.children = d._children; d._children = null; }
  });
  update(rootNode);
  setTimeout(fitView, 350);
}

function collapseAll() {
  rootNode.descendants().forEach(d => {
    if (d.children && d.data.id !== '__root__') {
      d._children = d.children; d.children = null;
    }
  });
  update(rootNode);
  setTimeout(fitView, 350);
}

function fitView() {
  const container = document.getElementById('chart');
  const W = container.clientWidth, H = container.clientHeight;
  const bounds = gMain.node().getBBox();
  if (!bounds.width || !bounds.height) return;
  const scale = Math.min(0.9, Math.min(W / (bounds.width + 60), H / (bounds.height + 60)));
  const tx = (W - bounds.width * scale) / 2 - bounds.x * scale;
  const ty = (H - bounds.height * scale) / 2 - bounds.y * scale;
  svg.transition().duration(500)
    .call(zoomBehavior.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

function resetView() {
  clearSearch();
  fitView();
}

function doZoom(factor) {
  svg.transition().call(zoomBehavior.scaleBy, factor);
}

// =============================================================
// SEARCH
// =============================================================
let searchTimer;
function handleSearch(q) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => applySearch(q.trim().toLowerCase()), 180);
}

function applySearch(q) {
  if (!q) {
    gMain.selectAll('.node').classed('dimmed', false).classed('search-match', false);
    gMain.selectAll('.link').classed('dimmed', false);
    return;
  }
  const matchIds = new Set();
  rootNode.descendants().forEach(d => {
    if (d.data.id === '__root__') return;
    const hit = d.data.name.toLowerCase().includes(q)
      || (d.data.title || '').toLowerCase().includes(q)
      || (d.data.dept || '').toLowerCase().includes(q);
    if (hit) {
      matchIds.add(d.data.id);
      let p = d.parent;
      while (p && p.data.id !== '__root__') { matchIds.add(p.data.id); p = p.parent; }
    }
  });
  const directIds = new Set();
  rootNode.descendants().forEach(d => {
    if (d.data.id === '__root__') return;
    const hit = d.data.name.toLowerCase().includes(q)
      || (d.data.title || '').toLowerCase().includes(q)
      || (d.data.dept || '').toLowerCase().includes(q);
    if (hit) directIds.add(d.data.id);
  });
  gMain.selectAll('.node')
    .classed('dimmed', d => !matchIds.has(d.data.id))
    .classed('search-match', d => directIds.has(d.data.id));
  gMain.selectAll('.link')
    .classed('dimmed', d => !matchIds.has(d.target.data.id));
}

function clearSearch() {
  document.getElementById('search').value = '';
  applySearch('');
}

// =============================================================
// TOOLTIP
// =============================================================
function showTip(event, d) {
  const color = deptColor(d.data.dept);
  const reports = (d.children || d._children || []).length;
  document.getElementById('tooltip').innerHTML = `
    <div class="tt-name">${d.data.name}</div>
    <div class="tt-title">${d.data.title || ''}</div>
    <span class="tt-dept" style="background:${color}">${d.data.dept || ''}</span>
    ${d.data.email ? `<div class="tt-detail">&#9993; ${d.data.email}</div>` : ''}
    ${d.data.location ? `<div class="tt-detail">&#128205; ${d.data.location}</div>` : ''}
    ${reports > 0 ? `<div class="tt-reports">&#128101; ${reports} direct report${reports !== 1 ? 's' : ''} &mdash; click to ${d._children ? 'expand' : 'collapse'}</div>` : '<div class="tt-reports">&#128100; No direct reports recorded</div>'}
  `;
  document.getElementById('tooltip').style.display = 'block';
}

function moveTip(event) {
  const tt = document.getElementById('tooltip');
  tt.style.left = Math.min(event.clientX + 16, window.innerWidth - 280) + 'px';
  tt.style.top = Math.max(event.clientY - 10, 10) + 'px';
}

function hideTip() {
  document.getElementById('tooltip').style.display = 'none';
}

// =============================================================
// LEGEND
// =============================================================
function buildLegend() {
  const depts = [...new Set(EMPLOYEES.map(e => e.dept).filter(Boolean))].sort();
  const bar = document.getElementById('legend-bar');
  depts.forEach(dept => {
    const color = deptColor(dept);
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.style.color = color;
    item.innerHTML = `<div class="legend-dot" style="background:${color}"></div>${dept}`;
    item.title = `Filter by ${dept}`;
    bar.appendChild(item);
  });
}

// =============================================================
// INIT
// =============================================================
buildLegend();
initChart();
window.addEventListener('resize', () => {
  const container = document.getElementById('chart');
  svg.attr('width', container.clientWidth).attr('height', container.clientHeight);
});
</script>
